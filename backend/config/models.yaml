llm_providers:
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    default_model: "meta-llama/llama-3.1-8b-instruct"
    fallback_model: "openai/gpt-4o-mini"
    temperature: 0.1
    max_tokens: 2048

  openai:
    default_model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 2048

  google:
    default_model: "gemini-2.5-flash"
    temperature: 0.1
    max_tokens: 2048

embeddings:
  provider: "openai"
  model: "text-embedding-3-small"

agent_models:
  market_scout:
    forecasting_engine: "prophet_lstm_hybrid"
    llm_summarizer: "meta-llama/llama-3.1-8b-instruct"
  
  demand_supply_matcher:
    vector_search_model: "text-embedding-3-small"
    reasoning_llm: "meta-llama/llama-3.1-8b-instruct"

  report_synthesizer:
    llm_model: "meta-llama/llama-3.1-8b-instruct"
    guardrail_validator: "pydantic"

  guardrail_validation:
    llm_model: "meta-llama/llama-3.1-8b-instruct"

  # Fast binary in_scope / out_of_scope intent classifier
  domain_guardrail:
    provider: "openrouter"
    llm_model: "meta-llama/llama-3.1-8b-instruct"
    temperature: 0.0
    fail_open: true

  # Upstream direct | web_search | rag classifier
  query_router:
    provider: "openrouter"
    llm_model: "meta-llama/llama-3.1-8b-instruct"
    temperature: 0.0
    fail_open_route: "rag"

  # Conversational agent for direct + web_search routes
  direct_agent:
    provider: "openrouter"
    llm_model: "meta-llama/llama-3.1-8b-instruct"
    temperature: 0.3

web_search:
  provider: "tavily"
  max_results: 5
  search_depth: "basic"
  include_answer: true
